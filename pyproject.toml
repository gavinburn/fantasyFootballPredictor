[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fantasy-football-predictor-submission"
version = "1.0.0"
description = "Inference-only 2026 standard-scoring fantasy football predictor"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4,<2",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=15,<23",
    "scikit-learn>=1.5,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
