[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fantasy-football-predictor"
version = "0.1.0"
description = "Standard-scoring NFL fantasy points-per-game predictor"
requires-python = ">=3.11"
dependencies = [
    "nflreadpy>=0.1.5,<0.2",
    "polars>=1.0,<2",
    "pyarrow>=15,<23",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "pandas>=2.2,<3",
    "seaborn>=0.13,<0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 88
target-version = "py311"
